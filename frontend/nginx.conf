# One origin for everything: the React app at /, the API at /api/.
# The browser never makes a cross-origin call, so there's no CORS preflight
# and no API URL baked into the frontend build.

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;              # don't advertise the Nginx version
    client_max_body_size 64k;       # the API only takes small JSON bodies

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API: forward to the NestJS container ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API sets TRUST_PROXY=true, so it reads the real client IP from
        # here — which its rate limiting depends on.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    root /usr/share/nginx/html;

    # ---- Built JS/CSS: file names contain a content hash, so cache forever ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Everything else is the single-page app ----
    # Unknown paths like /monitors/123 or /status/abc fall back to index.html
    # and React Router takes over. index.html itself is never cached, so a new
    # deploy is picked up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
